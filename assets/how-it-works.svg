te(38) scale(0.7)"><path d="M0 0 L -60 -170 V -700 Q -60 -728 -32 -728 H 32 Q 60 -728 60 -700 V -170 Z" fill="#1C1B19" opacity="0.28"/><g transform="rotate(-12 0 -730)"><path d="M-104 -716 H 104 V -748 H 74 L 82 -930 H -82 L -74 -748 H -104 Z" fill="#1C1B19" opacity="0.28"/></g></g><g transform="translate(404 788) rotate(38) scale(0.7)"><path d="M-60 -170 V -560 H -20 V -170 Z" fill="#BE4A3B"/><path d="M-20 -170 V -560 H 20 V -170 Z" fill="#A33B2E"/><path d="M20 -170 V -560 H 60 V -170 Z" fill="#86291F"/><path d="M-60 -170 Q -40 -150 -20 -170 Q 0 -150 20 -170 Q 40 -150 60 -170 L 0 0 Z" fill="#E6CFA6"/><path d="M-20 -170 Q 0 -150 20 -170 L 0 0 Z" fill="#D8BC8E"/><path d="M-19 -56 L 0 0 L 19 -56 Q 0 -48 -19 -56 Z" fill="#2E2C29"/><rect x="-62" y="-640" width="124" height="82" fill="#BDB6AA"/><rect x="-62" y="-640" width="40" height="82" fill="#D2CCC1"/><rect x="22" y="-640" width="40" height="82" fill="#9C958A"/><path d="M-62 -584 H 62 M-62 -614 H 62" stroke="#7E776D" stroke-width="8"/><path d="M-58 -640 V -700 Q -58 -726 -32 -726 H 32 Q 58 -726 58 -700 V -640 Z" fill="#E7B3A6"/><path d="M18 -640 V -722 Q 40 -718 58 -700 V -640 Z" fill="#D49787"/><g transform="rotate(-12 0 -730)"><rect x="-106" y="-750" width="212" height="34" rx="17" fill="#1C1B19"/><path d="M-74 -744 L -82 -930 Q -82 -944 -68 -944 H 68 Q 82 -944 82 -930 L 74 -744 Z" fill="#1C1B19"/><path d="M-74 -744 L -82 -930 Q -82 -944 -68 -944 H -40 L -36 -744 Z" fill="#35322E"/><path d="M-76 -760 H 76 L 78 -808 H -78 Z" fill="#A33B2E"/></g></g></svg>
    <text x="50" y="36" font-size="15" font-weight="700" fill="#1C1B19">Magic Mend</text>
    <g font-size="13">
      <rect x="20" y="62" width="70" height="28" rx="14" fill="#A33B2E"/><text x="55" y="81" fill="#fff" font-weight="600" text-anchor="middle">Simple</text>
      <rect x="98" y="62" width="96" height="28" rx="14" fill="none" stroke="#D2CEC7"/><text x="146" y="81" fill="#1C1B19" text-anchor="middle">Respectful</text>
      <rect x="202" y="62" width="62" height="28" rx="14" fill="none" stroke="#D2CEC7"/><text x="233" y="81" fill="#1C1B19" text-anchor="middle">Warm</text>
      <rect x="272" y="62" width="50" height="28" rx="14" fill="none" stroke="#D2CEC7"/><text x="297" y="81" fill="#1C1B19" text-anchor="middle">Firm</text>
    </g>
    <rect x="20" y="108" width="300" height="108" rx="12" fill="#fff" stroke="#E6E3DE" stroke-width="1.5"/>
    <text x="34" y="134" font-size="14" fill="#1C1B19">Hey Sam, the plumber cannot come</text>
    <text x="34" y="154" font-size="14" fill="#1C1B19">until Thursday. Can we push the</text>
    <text x="34" y="174" font-size="14" fill="#1C1B19">move-in date to Saturday instead?</text>
    <rect x="166" y="184" width="60" height="24" rx="7" fill="none" stroke="#D2CEC7"/><text x="196" y="201" font-size="12" font-weight="600" fill="#1C1B19" text-anchor="middle">Copy</text>
    <rect x="234" y="184" width="76" height="24" rx="7" fill="#A33B2E"/><text x="272" y="201" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Replace</text>
    <rect x="20" y="228" width="300" height="88" rx="12" fill="#fff" stroke="#E6E3DE" stroke-width="1.5"/>
    <rect x="34" y="248" width="250" height="10" rx="5" fill="#ECEAE6"/>
    <rect x="34" y="268" width="210" height="10" rx="5" fill="#ECEAE6"/>
    <rect x="34" y="288" width="140" height="10" rx="5" fill="#ECEAE6"/>
    <rect x="20" y="328" width="300" height="28" rx="9" fill="#F5F4F1" stroke="#E1DED8"/>
    <text x="32" y="347" font-size="12" fill="#9A968F">Ask for a change...</text>
  </g>
  <g transform="translate(860 470)">
    <circle cx="20" cy="20" r="20" fill="#A33B2E"/><text x="20" y="27" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="54" y="20" font-size="22" font-weight="700" fill="#1C1B19">Pick a tone</text>
    <text x="54" y="46" font-size="16" fill="#5F5C57">or ask for a change</text>
  </g>

  <path d="M1218 255 L1268 255" stroke="#C3BDB4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Step 4: replaced -->
  <g transform="translate(1290 90)" filter="url(#shadow)">
    <rect width="250" height="330" rx="22" fill="#fff"/>
    <rect width="250" height="44" rx="22" fill="#EFEDE9"/>
    <rect y="22" width="250" height="22" fill="#EFEDE9"/>
    <circle cx="26" cy="22" r="6" fill="#FF5F57"/><circle cx="46" cy="22" r="6" fill="#FEBC2E"/><circle cx="66" cy="22" r="6" fill="#28C840"/>
    <rect x="20" y="150" width="210" height="104" rx="14" fill="none" stroke="#A33B2E" stroke-width="2"/>
    <text x="34" y="180" font-size="15" fill="#1C1B19">Hey Sam, the plumber</text>
    <text x="34" y="202" font-size="15" fill="#1C1B19">cannot come until Thursday.</text>
    <text x="34" y="224" font-size="15" fill="#1C1B19">Can we push the move-in...</text>
    <rect x="20" y="270" width="210" height="36" rx="18" fill="#F5F4F1"/>
    <text x="125" y="294" font-size="14" fill="#5F5C57" text-anchor="middle">You press Send</text>
    <circle cx="200" cy="100" r="26" fill="#E5F0E8"/>
    <path d="M188 100 l8 8 l16 -16" stroke="#2F6B45" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(1290 470)">
    <circle cx="20" cy="20" r="20" fill="#A33B2E"/><text x="20" y="27" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="54" y="20" font-size="22" font-weight="700" fill="#1C1B19">Click Replace</text>
    <text x="54" y="46" font-size="16" fill="#5F5C57">never sent for you</text>
  </g>
</svg>
