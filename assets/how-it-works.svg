<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" font-family="Segoe UI, Segoe UI Variable Display, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1C1B19" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#C3BDB4"/>
    </marker>
  </defs>
  <rect width="1600" height="600" rx="36" fill="#F5F4F1"/>

  <!-- Step 1: select -->
  <g transform="translate(60 90)" filter="url(#shadow)">
    <rect width="320" height="330" rx="22" fill="#fff"/>
    <rect width="320" height="44" rx="22" fill="#EFEDE9"/>
    <rect y="22" width="320" height="22" fill="#EFEDE9"/>
    <circle cx="26" cy="22" r="6" fill="#FF5F57"/><circle cx="46" cy="22" r="6" fill="#FEBC2E"/><circle cx="66" cy="22" r="6" fill="#28C840"/>
    <text x="104" y="28" font-size="15" fill="#6E6A64">Any app</text>
    <rect x="24" y="74" width="190" height="34" rx="17" fill="#E9F8EE"/>
    <text x="40" y="96" font-size="15" fill="#1C1B19">Keys are ready Friday!</text>
    <rect x="24" y="150" width="272" height="96" rx="12" fill="#F3D6D1"/>
    <text x="38" y="180" font-size="16" fill="#1C1B19">hey sam, the plumber cant come</text>
    <text x="38" y="204" font-size="16" fill="#1C1B19">till thursday so can we push the</text>
    <text x="38" y="228" font-size="16" fill="#1C1B19">move-in date to saturday instead</text>
    <rect x="24" y="270" width="272" height="38" rx="19" fill="none" stroke="#E1DED8" stroke-width="2"/>
    <text x="42" y="295" font-size="14" fill="#9A968F">Type a message</text>
  </g>
  <g transform="translate(60 470)">
    <circle cx="20" cy="20" r="20" fill="#A33B2E"/><text x="20" y="27" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="54" y="20" font-size="22" font-weight="700" fill="#1C1B19">Select text</text>
    <text x="54" y="46" font-size="16" fill="#5F5C57">in any app you write in</text>
  </g>

  <path d="M398 255 L448 255" stroke="#C3BDB4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Step 2: hotkey -->
  <g transform="translate(470 90)" filter="url(#shadow)">
    <rect width="300" height="330" rx="22" fill="#fff"/>
  </g>
  <g transform="translate(470 90)">
    <g transform="translate(26 120)">
      <rect width="74" height="74" rx="14" fill="#F5F4F1" stroke="#DCD8D1" stroke-width="2"/>
      <rect y="66" width="74" height="8" rx="4" fill="#DCD8D1"/>
      <text x="37" y="45" font-size="20" font-weight="600" fill="#1C1B19" text-anchor="middle">Ctrl</text>
      <rect x="87" width="74" height="74" rx="14" fill="#F5F4F1" stroke="#DCD8D1" stroke-width="2"/>
      <rect x="87" y="66" width="74" height="8" rx="4" fill="#DCD8D1"/>
      <text x="124" y="45" font-size="20" font-weight="600" fill="#1C1B19" text-anchor="middle">Alt</text>
      <rect x="174" width="74" height="74" rx="14" fill="#A33B2E"/>
      <text x="211" y="47" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">R</text>
    </g>
    <text x="150" y="250" font-size="15" fill="#6E6A64" text-anchor="middle">Ctrl+Option+R on Mac</text>
  </g>
  <g transform="translate(470 470)">
    <circle cx="20" cy="20" r="20" fill="#A33B2E"/><text x="20" y="27" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="54" y="20" font-size="22" font-weight="700" fill="#1C1B19">Press the hotkey</text>
    <text x="54" y="46" font-size="16" fill="#5F5C57">two drafts start at once</text>
  </g>

  <path d="M788 255 L838 255" stroke="#C3BDB4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Step 3: popup -->
  <g transform="translate(860 70)" filter="url(#shadow)">
    <rect width="340" height="370" rx="22" fill="#fff"/>
  </g>
  <g transform="translate(860 70)">
    <svg x="18" y="18" width="24" height="24" viewBox="0 0 1024 1024"><rect x="80" y="80" width="864" height="864" rx="200" fill="#F5F4F1" stroke="#1C1B19" stroke-width="32"/><path d="M 430.0 748.0 L 425.5 748.2 L 421.0 750.1 L 417.0 753.6 L 413.7 758.7 L 411.5 765.1 L 410.6 772.6 L 411.2 780.8 L 413.5 789.3 L 417.5 797.8 L 423.2 805.7 L 430.4 812.7 L 439.0 818.4 L 448.7 822.5 L 459.1 824.7 L 469.9 824.9 L 480.6 823.0 L 490.9 819.0 L 500.2 813.0 L 508.4 805.4 L 514.9 796.4 L 519.6 786.4 L 522.2 776.0 L 522.8 765.6 L 521.3 755.7 L 517.9 746.8 L 512.8 739.5 L 506.3 734.0 L 498.8 730.8 L 490.9 730.7 L 483.4 734.1 L 476.9 739.7 L 471.9 747.1 L 468.5 756.0 L 467.1 765.8 L 467.7 776.1 L 470.4 786.4 L 474.9 796.1 L 481.3 804.9 L 489.1 812.3 L 498.0 818.1 L 507.7 822.0 L 517.8 823.9 L 527.8 823.9 L 537.5 822.0 L 546.4 818.5 L 554.2 813.5 L 560.8 807.5 L 565.9 800.7 L 569.6 793.6 L 571.8 786.5 L 572.5 779.8 L 572.0 773.9 L 570.4 768.9 L 568.1 765.1 L 565.2 762.6 L 562.1 761.6 L 559.0 761.9 L 556.0 761.8 L 553.0 762.7 L 550.2 764.9 L 547.9 768.5 L 546.3 773.2 L 545.7 778.8 L 546.3 785.1 L 548.2 791.8 L 551.6 798.6 L 556.3 805.1 L 562.3 811.0 L 569.5 815.9 L 577.8 819.5 L 586.7 821.6 L 596.1 822.0 L 605.6 820.7 L 614.7 817.6 L 623.3 812.7 L 630.8 806.4 L 637.0 798.7 L 641.8 790.2 L 644.8 781.1 L 645.9 771.8 L 645.3 762.9 L 643.0 754.8 L 639.1 747.9 L 633.8 742.6 L 627.7 739.2 L 620.9 738.4 L 614.4 741.1 L 608.6 745.9 L 604.0 752.5 L 600.8 760.5 L 599.2 769.5 L 599.4 779.1 L 601.5 788.9 L 605.4 798.3 L 611.0 807.1 L 618.1 814.7 L 626.4 820.9 L 635.5 825.4 L 645.2 828.1 L 655.0 829.0 L 664.6 828.0 L 673.6 825.4 L 681.8 821.2 L 688.8 815.8 L 694.5 809.4 L 698.7 802.6 L 701.4 795.5 L 702.6 788.6 L 702.5 782.3 L 701.1 776.9 L 698.7 772.5 L 695.6 769.5 L 692.0 767.9 L 688.2 767.8 L 684.4 767.3 L 680.5 767.6 L 676.8 769.4 L 673.6 772.8 L 671.2 777.6 L 669.9 783.5 L 669.9 790.4 L 671.4 797.8 L 674.6 805.4 L 679.5 812.7 L 686.0 819.4 L 693.9 825.0 L 703.1 829.1 L 713.2 831.5 L 723.9 83