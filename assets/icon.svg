<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- paper tile with an ink outline -->
  <rect x="80" y="80" width="864" height="864" rx="200" fill="#F5F4F1" stroke="#1C1B19" stroke-width="32"/>
  <!-- mirrored so the stitches run left to right and the needle leads -->
  <g transform="translate(1024 0) scale(-1 1) translate(-100 -80)">
    <!-- madder thread: two running stitches, then up to the eye of the needle -->
    <g stroke="#A33B2E" stroke-width="44" stroke-linecap="round" fill="none">
      <path d="M462 764 H 530"/>
      <path d="M606 764 H 674"/>
      <path d="M750 764 C 800 764, 812 700, 806 600 C 800 470, 790 380, 746 336"/>
    </g>
    <!-- ink needle -->
    <g transform="rotate(38 600 520)">
      <path d="M600 210 C 626 210, 638 236, 638 262 L 630 700 L 600 836 L 570 700 L 562 262 C 562 236, 574 210, 600 210 Z" fill="#1C1B19"/>
      <rect x="588" y="236" width="24" height="96" rx="12" fill="#F5F4F1"/>
    </g>
  </g>
</svg>
